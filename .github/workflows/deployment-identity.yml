name: deployment-identity
on: workflow_dispatch
permissions:
  contents: read
jobs:
  identity:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      id-token: write
    steps:
      - name: Show only the OIDC trust claims for AWS setup
        run: |
          node --input-type=module <<'JS'
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set('audience', 'sts.amazonaws.com');
          const response = await fetch(url, {
            headers: {Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`},
            signal: AbortSignal.timeout(10000),
          });
          if (!response.ok) throw new Error('OIDC_REQUEST_FAILED');
          const {value} = await response.json();
          const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString('utf8'));
          console.log(JSON.stringify({aud: claims.aud, sub: claims.sub}));
          JS
