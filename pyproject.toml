[project]
name = "prism-backend"
version = "0.1.0"
description = "PRism API foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2,<3",
    "sqlalchemy[asyncio]>=2,<3",
    "psycopg[binary]>=3,<4",
    "alembic>=1,<2",
    "httpx>=0.27,<1",
    "pyjwt[crypto]>=2.10,<3",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-java>=0.23,<0.24",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-python>=0.23,<0.26",
    "langchain>=1.4.2",
    "langchain-deepseek>=1.1.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "mypy>=1,<2"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a real PostgreSQL database"]

[tool.setuptools.package-data]
"app.domain.review.harness" = ["*.md"]
